# Local Supabase configuration for Neon Barrage.
# This file contains no project credentials. Production linkage is supplied at
# deploy time with SUPABASE_PROJECT_REF and the Supabase CLI session.
project_id = "shootemup-bench-a2a-async-streaming-opencode-neon-barrage"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = false

[storage]
enabled = false

[analytics]
enabled = false
